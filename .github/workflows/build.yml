name: SparkOS Cloud Core Builder

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  compile-on-crave:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout SparkOS Controller
      uses: actions/checkout@v4

    - name: Setup Remote Crave CLI Tool
      run: |
        mkdir -p ${HOME}/bin
        curl -sL https://raw.githubusercontent.com/accupara/crave/master/get_crave.sh | bash -s --
        mv crave ${HOME}/bin/
        echo "${HOME}/bin" >> $GITHUB_PATH

    - name: Configure Secure Cloud Authentication
      run: |
        mkdir -p ~/.crave
        cat <<EOF > ~/.crave/crave.conf
        [User]
        username = ${{ secrets.CRAVE_USERNAME }}
        token = ${{ secrets.CRAVE_TOKEN }}
        EOF

    - name: Execute Remote AOSP Compile Sequence
      run: |
        echo "======================================================="
        echo "   LAUNCHING SPARKOS ENGINE ON REMOTE BUILD NODES      "
        echo "======================================================="
        crave run --no-patch -- '
          # 1. Initialize stable original AOSP build tree mapping
          repo init -u https://android.googlesource.com/platform/manifest -b android-14.0.0_r50
          
          # 2. Leverage Crave's internal high-speed network mirror caches for synchronization
          /opt/crave/resync.sh
          
          # 3. Pull down your custom controller configurations and media layers
          git clone https://github.com/kirasimon565/SparkOS.git -b main sparkos_overlay
          
          # 4. Seamlessly smash your cinematic boot assets over Google stock frameworks
          if [ -d "sparkos_overlay/overlay" ]; then
            rsync -avq sparkos_overlay/overlay/ ./
          fi
          
          # 5. Authorize and fire branding variable changes
          chmod +x sparkos_overlay/inject_branding.sh
          ./sparkos_overlay/inject_branding.sh
          
          # 6. Execute full parallel framework compilation
          source build/envsetup.sh
          lunch aosp_arm64-trunk_staging-userdebug
          m systemimage
          
          # 7. High-efficiency compression of the output partition artifact
          xz -z -9 out/target/product/generic_arm64/system.img
        '

    - name: Pull Compiled SparkOS Build Back Natively
      run: |
        crave pull out/target/product/generic_arm64/system.img.xz

    - name: Upload SparkOS Flashable Release
      uses: softprops/action-gh-release@v2
      with:
        files: out/target/product/generic_arm64/system.img.xz
        tag_name: sparkos-alpha-v1
        name: SparkOS Alpha Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
