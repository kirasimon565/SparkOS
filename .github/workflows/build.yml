name: SparkOS Cloud Core Builder

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  compile-on-crave:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout SparkOS Controller
      uses: actions/checkout@v4

    - name: Setup Remote Crave CLI Tool
      run: |
        mkdir -p ${HOME}/bin
        curl -sL https://raw.githubusercontent.com/accupara/crave/master/get_crave.sh | bash -s --
        mv crave ${HOME}/bin/
        echo "${HOME}/bin" >> $GITHUB_PATH

    - name: Configure Crave Infrastructure and Workspace
      env:
        CRAVE_USER: ${{ secrets.CRAVE_USERNAME }}
        CRAVE_TOK: ${{ secrets.CRAVE_TOKEN }}
      run: |
        python3 -c '
        import os, json, subprocess
        
        # 1. Generate pristine crave.conf file in Home Directory
        config = {
            "username": os.environ["CRAVE_USER"],
            "headers": {
                "Content-Type": "application/json",
                "Authorization": os.environ["CRAVE_TOK"],
                "User-Agent": "Crave"
            },
            "projects": [],
            "server": "https://foss.crave.io/api"
        }
        crave_conf_path = os.path.expanduser("~/crave.conf")
        with open(crave_conf_path, "w") as f:
            json.dump(config, f, indent=4)
            
        # 2. Extract and sanitize Project details by stripping table borders
        try:
            raw_output = subprocess.check_output(["crave", "-c", crave_conf_path, "list"], text=True)
            print("=== RAW CRAVE SERVER LIST ===")
            print(raw_output)
            print("=============================")
            
            project_id = ""
            project_name = ""
            
            for line in raw_output.split("\n"):
                clean_line = line.replace("|", " ").strip()
                parts = clean_line.split()
                
                if parts and parts[0].isdigit():
                    project_id = parts[0]
                    project_name = parts[1]
                    break
                    
            if not project_id or not project_name:
                raise Exception("Table parser found no numeric ID row.")
                
            print(f"Successfully Bound to Project ID: {project_id}")
            print(f"Successfully Bound to Project Name: {project_name}")
            
            # 3. FIXED: Writing crave.json directly into the active GITHUB_WORKSPACE root
            target_workspace = os.environ["GITHUB_WORKSPACE"]
            with open(os.path.join(target_workspace, "crave.json"), "w") as f:
                json.dump({"project": project_name}, f, indent=4)
                
            # 4. Export the verified ID to the GitHub Environment
            with open(os.environ["GITHUB_ENV"], "a") as ge:
                ge.write(f"CRAVE_PROJECT_ID={project_id}\n")
                
        except Exception as e:
            print("Parser Warning: Falling back to default baseline parameters:", e)
            target_workspace = os.environ["GITHUB_WORKSPACE"]
            with open(os.path.join(target_workspace, "crave.json"), "w") as f:
                json.dump({"project": "aosp"}, f, indent=4)
            with open(os.environ["GITHUB_ENV"], "a") as ge:
                ge.write("CRAVE_PROJECT_ID=73\n")
        '

    - name: Execute Remote AOSP Compile Sequence
      run: |
        echo "======================================================="
        echo "   LAUNCHING SPARKOS ENGINE ON REMOTE BUILD NODES      "
        echo "======================================================="
        cd $GITHUB_WORKSPACE
        crave -c $HOME/crave.conf run --projectID ${{ env.CRAVE_PROJECT_ID }} --no-patch -- "
          # 1. Initialize stable original AOSP build tree mapping
          repo init -u https://android.googlesource.com/platform/manifest -b android-14.0.0_r50
          
          # 2. Leverage Crave's internal high-speed network mirror caches for synchronization
          /opt/crave/resync.sh
          
          # 3. Pull down your custom controller configurations and media layers
          git clone https://github.com/kirasimon565/SparkOS.git -b main sparkos_overlay
          
          # 4. Seamlessly smash your cinematic boot assets over Google stock frameworks
          if [ -d \"sparkos_overlay/overlay\" ]; then
            rsync -avq sparkos_overlay/overlay/ ./
          fi
          
          # 5. Authorize and fire branding variable changes
          chmod +x sparkos_overlay/inject_branding.sh
          ./sparkos_overlay/inject_branding.sh
          
          # 6. Execute full parallel framework compilation
          source build/envsetup.sh
          lunch aosp_arm64-trunk_staging-userdebug
          m systemimage
          
          # 7. High-efficiency compression of the output partition artifact
          xz -z -9 out/target/product/generic_arm64/system.img
        "

    - name: Pull Compiled SparkOS Build Back Natively
      run: |
        cd $GITHUB_WORKSPACE
        crave -c $HOME/crave.conf pull --projectID ${{ env.CRAVE_PROJECT_ID }} out/target/product/generic_arm64/system.img.xz

    - name: Upload SparkOS Flashable Release
      uses: softprops/action-gh-release@v2
      with:
        files: out/target/product/generic_arm64/system.img.xz
        tag_name: sparkos-alpha-v1
        name: SparkOS Alpha Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
